<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriNexus - Field Setup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="max-width: 600px; margin: 40px auto; padding: 20px;">
    <header style="text-align: center; margin-bottom: 30px;">
      <h1 style="margin: 0 0 10px; font-size: 2rem;">🌾 AgriNexus</h1>
      <p class="muted">Smart agricultural intelligence & environmental monitoring</p>
    </header>

    <div class="card" style="background: var(--panel); border: 1px solid rgba(126, 217, 87, 0.2); border-radius: 16px; padding: 24px;">
      
      <!-- Step 1: Field Coordinates & Live Location -->
      <div style="margin-bottom: 24px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
          <label style="font-weight: 600; color: var(--text);">
            <span style="background: var(--accent); color: #000; border-radius: 50%; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.85rem; margin-right: 6px;">1</span> 
            Where is your field?
          </label>
          <span id="locStatus" style="font-size: 0.75rem; color: var(--accent);">📍 Auto-detecting live location...</span>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
          <input type="text" id="latInput" placeholder="Latitude (e.g. 7.34)" style="padding: 10px; background: var(--panel2); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: var(--text); outline: none;">
          <input type="text" id="lonInput" placeholder="Longitude (e.g. -2.33)" style="padding: 10px; background: var(--panel2); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: var(--text); outline: none;">
        </div>
        <button id="useLocationBtn" class="btn" style="width: 100%; padding: 10px; background: var(--panel2); border: 1px solid var(--accent); border-radius: 8px; color: var(--accent); font-weight: 600; cursor: pointer; font-size: 0.85rem;">
          🔄 Refresh Live GPS Location
        </button>
      </div>

      <!-- Step 2 -->
      <div style="margin-bottom: 24px;">
        <label style="display:block; margin-bottom: 10px; font-weight: 600; color: var(--text);">
          <span style="background: var(--accent); color: #000; border-radius: 50%; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.85rem; margin-right: 6px;">2</span> 
          What did you grow last season?
        </label>
        <select id="lastCropSelect" style="width: 100%; padding: 12px; background: var(--panel2); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: var(--text); outline: none; cursor: pointer;">
          <option value="none">Nothing / First time planting</option>
          <option value="maize">Maize (Cereal)</option>
          <option value="cassava">Cassava (Root)</option>
          <option value="tomato">Tomato (Solanaceous)</option>
          <option value="cowpea">Cowpea (Legume)</option>
          <option value="yam">Yam (Root)</option>
          <option value="pepper">Hot Pepper (Solanaceous)</option>
          <option value="plantain">Plantain (Fruit)</option>
          <option value="groundnut">Groundnut (Legume)</option>
        </select>
      </div>

      <!-- Step 4: Search & Toggle Crop Preview -->
      <div style="margin-bottom: 24px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <label style="font-weight: 600; color: var(--text);">
            <span style="background: var(--accent); color: #000; border-radius: 50%; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.85rem; margin-right: 6px;">4</span> 
            Explore Crop Database & Search
          </label>
          <button id="toggleHomeCrops" type="button" style="padding: 4px 10px; background: var(--panel2); border: 1px solid var(--accent); color: var(--accent); border-radius: 6px; cursor: pointer; font-size: 0.75rem;">
            Show All
          </button>
        </div>
        <input type="text" id="homeCropSearch" placeholder="🔍 Search any crop to preview..." style="width: 100%; box-sizing: border-box; padding: 10px 14px; background: var(--panel2); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: var(--text); outline: none; margin-bottom: 10px;">
        <div id="homeCropList" style="max-height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;"></div>
      </div>

      <!-- Step 3: Check My Field Button -->
      <div>
        <button id="submitBtn" class="btn" style="width: 100%; padding: 14px; background: var(--accent); color: #000; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer;">
          3 🚀 Check My Field & 30-Day History
        </button>
      </div>

    </div>
  </div>

  <script>
    const DEMO_CROPS = {
      maize: { name: 'Maize (Corn)', emoji: '🌽', family: 'cereal', note: 'Staple cereal; moderate water needed.' },
      cassava: { name: 'Cassava', emoji: '🥔', family: 'root', note: 'Drought-resistant root crop.' },
      tomato: { name: 'Tomato', emoji: '🍅', family: 'solanaceous', note: 'High water requirement.' },
      cowpea: { name: 'Cowpea (Bean)', emoji: '🌱', family: 'legume', note: 'Nitrogen-fixing legume.' },
      yam: { name: 'Yam', emoji: '🍠', family: 'root', note: 'Requires well-drained soil.' },
      pepper: { name: 'Hot Pepper', emoji: '🌶️', family: 'solanaceous', note: 'Good cash crop.' },
      plantain: { name: 'Plantain', emoji: '🍌', family: 'fruit', note: 'Requires high moisture.' },
      groundnut: { name: 'Groundnut', emoji: '🥜', family: 'legume', note: 'Grows well in sandy-loam.' }
    };

    let showAllHomeCrops = false;

    function renderHomeCrops(query = '') {
      const q = query.toLowerCase().trim();
      const entries = Object.entries(DEMO_CROPS).filter(([k, c]) => 
        q.length > 0 || showAllHomeCrops ? (c.name.toLowerCase().includes(q) || c.family.toLowerCase().includes(q)) : false
      );

      const container = document.getElementById('homeCropList');
      if (entries.length === 0) {
        container.innerHTML = `<p class="muted" style="font-size:0.8rem; text-align:center; margin:5px 0;">Type to search or click "Show All" to preview crops.</p>`;
        return;
      }

      container.innerHTML = entries.map(([k, c]) => `
        <div style="display:flex; align-items:center; gap:8px; padding:6px 10px; background:var(--panel2); border-radius:6px; font-size:0.85rem;">
          <span>${c.emoji}</span>
          <strong style="color:var(--text);">${c.name}</strong>
          <span class="muted" style="margin-left:auto; font-size:0.75rem;">${c.note}</span>
        </div>
      `).join('');
    }

    function fetchLiveLocation() {
      const statusEl = document.getElementById('locStatus');
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          document.getElementById('latInput').value = pos.coords.latitude.toFixed(4);
          document.getElementById('lonInput').value = pos.coords.longitude.toFixed(4);
          statusEl.textContent = `🟢 Live GPS Active (${pos.coords.latitude.toFixed(2)}°, ${pos.coords.longitude.toFixed(2)}°)`;
        }, err => {
          statusEl.textContent = '⚠️ Location access denied. Using default Sunyani coordinates.';
          document.getElementById('latInput').value = '7.3399';
          document.getElementById('lonInput').value = '-2.3268';
        }, { timeout: 10000 });
      } else {
        statusEl.textContent = '⚠️ Geolocation not supported.';
        document.getElementById('latInput').value = '7.3399';
        document.getElementById('lonInput').value = '-2.3268';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderHomeCrops();
      fetchLiveLocation();

      const searchInput = document.getElementById('homeCropSearch');
      const toggleBtn = document.getElementById('toggleHomeCrops');

      if (searchInput) {
        searchInput.addEventListener('input', (e) => renderHomeCrops(e.target.value));
      }

      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          showAllHomeCrops = !showAllHomeCrops;
          toggleBtn.textContent = showAllHomeCrops ? 'Hide' : 'Show All';
          renderHomeCrops(searchInput ? searchInput.value : '');
        });
      }

      document.getElementById('useLocationBtn').addEventListener('click', fetchLiveLocation);

      document.getElementById('submitBtn').addEventListener('click', () => {
        const lat = parseFloat(document.getElementById('latInput').value) || 7.3399;
        const lon = parseFloat(document.getElementById('lonInput').value) || -2.3268;
        const lastCrop = document.getElementById('lastCropSelect').value;

        const fieldData = {
          name: 'My Live Field',
          lat: lat,
          lon: lon,
          lastCrop: lastCrop
        };

        localStorage.setItem('agrinexus_active_field', JSON.stringify(fieldData));
        window.location.href = `dashboard.html?lat=${lat}&lon=${lon}&lastCrop=${lastCrop}&name=My+Live+Field`;
      });
    });
  </script>
</body>
</html>
