<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriNexus - Field Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <div>
        <h1 style="margin:0; font-size:1.5rem;">🌾 AgriNexus Dashboard</h1>
        <p class="muted" id="fieldSubtitle">High-resolution field monitoring & intelligence</p>
      </div>
      <a href="index.html" class="btn" style="text-decoration:none; font-size:0.9rem; padding:6px 12px; background:var(--panel2); border-radius:8px;">← Back to Map</a>
    </header>

    <div id="bigStatus"></div>

    <div class="card-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; margin-bottom:20px;" id="statGrid"></div>

    <div class="card" style="margin-bottom:20px;">
      <h3 style="margin-top:0;">🌧️ Soil Wetness & Rainfall Trends</h3>
      <p class="muted">Recent root-zone moisture and daily precipitation patterns.</p>
      <div style="margin-top:15px;">
        <h4 style="margin:0 0 5px; font-size:0.9rem; color:var(--accent);">Root Zone Soil Wetness</h4>
        <div id="moistChart"></div>
      </div>
      <div style="margin-top:20px;">
        <h4 style="margin:0 0 5px; font-size:0.9rem; color:#6ec6ff;">Daily Precipitation (mm)</h4>
        <div id="precipChart"></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <h3 style="margin-top:0;">🌱 What To Plant</h3>
      <p class="muted" id="rotationNote"></p>
      <div class="crop-list" id="cropList"></div>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">💡 Recommended Field Actions</h3>
      <ul id="actionList" style="margin:0; padding-left:20px; line-height:1.6;"></ul>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    let field = null;

    window.addEventListener('DOMContentLoaded', async () => {
      const stored = localStorage.getItem('agrinexus_active_field');
      if (!stored) {
        window.location.href = 'index.html';
        return;
      }
      field = JSON.parse(stored);
      document.getElementById('fieldSubtitle').textContent = `${field.name} (${field.lat.toFixed(2)}°, ${field.lon.toFixed(2)}°)`;

      try {
        const data = await fetchFieldData(field.lat, field.lon);
        renderResults(data);
      } catch (err) {
        console.error(err);
        document.getElementById('bigStatus').innerHTML = `<div class="big-status bad"><span class="icon">⚠️</span>Failed to load field data. Please check your API credentials.</div>`;
      }
    });

    function renderResults(d) {
      const risks = analyzeRisks(d);
      const bigStatus = document.getElementById('bigStatus');
      if (risks.droughtRisk) {
        bigStatus.innerHTML = `<div class="big-status bad"><span class="icon">🏜️</span>Your soil is DRY — plant drought-tough crops</div>`;
      } else if (risks.waterlogRisk) {
        bigStatus.innerHTML = `<div class="big-status warn"><span class="icon">🌊</span>Soil is VERY WET — watch for flooding</div>`;
      } else {
        bigStatus.innerHTML = `<div class="big-status ok"><span class="icon">✅</span>Soil moisture looks GOOD for planting</div>`;
      }
      if (risks.heatStress) {
        const banner = document.createElement('div');
        banner.className = 'big-status bad';
        banner.innerHTML = '<span class="icon">🔥</span>Hot temperatures — crops may need extra water/shade';
        bigStatus.appendChild(banner);
      }

      document.getElementById('statGrid').innerHTML = `
        <div class="stat"><div class="val">${d.avgTemp.toFixed(0)}°C</div><div class="lbl">Temperature</div></div>
        <div class="stat"><div class="val">${d.avgPrecip.toFixed(1)}mm</div><div class="lbl">Daily Rain (avg)</div></div>
        <div class="stat"><div class="val">${(d.avgRootMoist*100).toFixed(0)}%</div><div class="lbl">Soil Wetness (deep)</div></div>
        <div class="stat"><div class="val">${(d.avgHumidity).toFixed(0)}%</div><div class="lbl">Humidity</div></div>
      `;

      document.getElementById('moistChart').innerHTML = lineChartWithLabels(d.moistSeries, '#7ed957', v => (v*100).toFixed(0)+'%', 1);
      document.getElementById('precipChart').innerHTML = barChartWithLabels(d.precipSeries, '#6ec6ff', v => v.toFixed(1)+'mm', d.dates);

      const {top: recommended, lastFamily} = pickCrops(risks, field.lastCrop);
      document.getElementById('rotationNote').textContent = lastFamily
        ? `You grew ${field.lastCrop} last time. Here are the best crops to plant next to protect and feed your soil:`
        : `Recommended crops for your current soil and weather conditions:`;

      document.getElementById('cropList').innerHTML = recommended.map(([k, c]) => `
        <div class="crop">
          <div class="emoji">${c.emoji}</div>
          <div>
            <h4>${c.name}</h4>
            <p>${c.note}</p>
          </div>
        </div>
      `).join('');

      document.getElementById('actionList').innerHTML = buildActions(risks, lastFamily).map(a => `<li>${a}</li>`).join('');
    }
  </script>
</body>
</html>
